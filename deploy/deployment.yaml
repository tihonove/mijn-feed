apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  # One sqlite writer at a time on the node-local volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: app
          ports:
            - containerPort: 8080
          env:
            - name: PUBLIC_ORIGIN
              value: https://feed.tihonove.dev
            - name: OWNER_EMAILS
              value: tihonov.ea@gmail.com
          envFrom:
            - secretRef:
                name: mijn-feed-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 384Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
