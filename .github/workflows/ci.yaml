name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["deploy/kustomization.yaml"]
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Ratchet: fails if coverage drops below the thresholds in vitest.config.ts.
      - run: npm run test:coverage -- --coverage.thresholds.autoUpdate=false
      - run: npm run build

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Deploy commits to main one at a time.
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=$(git rev-parse --short HEAD)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
      # Committing the new tag is the deploy: Flux picks it up within a minute.
      - name: Deploy
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git pull -q --rebase origin main
          sed -i "s/newTag: .*/newTag: ${{ steps.tag.outputs.tag }}/" deploy/kustomization.yaml
          git commit -am "deploy: ${{ steps.tag.outputs.tag }}"
          git push origin HEAD:main
